# Render Blueprint: New > Blueprint > pick this repo. Free plan works; HTTPS is automatic
# (the browser only allows camera access over HTTPS).
services:
  - type: web
    name: rubik-tutor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ANTHROPIC_API_KEY      # optional: enables AI phrasing; the app works without it
        sync: false
      - key: LLM_LIMIT_PER_MINUTE
        value: "20"
